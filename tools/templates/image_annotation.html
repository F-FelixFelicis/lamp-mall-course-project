<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯具图搜相关性人工标注</title>
<style>body{font:16px/1.7 system-ui,sans-serif;color:#243d33;background:#f6f4ed;margin:0}main{max-width:1200px;margin:auto;padding:28px}h1{font-size:28px}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #becbb9;border-radius:6px;background:white}button{background:#315745;color:white;cursor:pointer}header{display:flex;gap:15px;flex-wrap:wrap;align-items:center}.query{background:white;padding:20px;margin:24px 0;display:flex;gap:28px;align-items:center;flex-wrap:wrap}.query img{max-width:280px;max-height:260px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}.card{background:white;padding:15px}.card img{width:100%;height:190px;object-fit:contain}.card select{width:100%}.card p{margin:6px 0}textarea{width:100%;box-sizing:border-box;min-height:70px}.muted{color:#6e7a66;font-size:14px}.status{padding:10px;background:#e3eadc}a{color:#315745}</style>
<main><h1>灯具图搜相关性人工标注</h1><p>请独立判断参考图与各商品的外形、灯罩结构、灯体和风格。仅灯型相同不能判为强相关。此页面不显示算法排序或分数。</p><p>2 = 强相关；1 = 弱相关；0 = 不相关。无法可靠判断灯具时，写明原因排除整张查询图。两名组员各自导出一份；有分歧的查询由另一名组员裁定并填写理由。</p>
<header><label>标注人代号 <input id="reviewer" placeholder="例如 member-a"></label><label>查询图 <select id="query"></select></label><button id="export">导出标注或进度</button><label>导入已保存进度 <input id="import" type="file" accept="application/json"></label></header><p id="progress" class="status"></p><div class="query"><img id="query-image" alt="参考灯具照片"><div><h2 id="query-title"></h2><a id="query-source" target="_blank" rel="noopener">参考图来源</a><p id="query-author" class="muted"></p><label><input id="duplicates" type="checkbox">已人工核对来源和近重复情况</label></div></div><p id="near" class="muted"></p><label>排除该查询图的原因（可判断时留空）<textarea id="exclude" placeholder="例如目标过小，无法判断相关性"></textarea></label><label>裁定理由或备注<textarea id="reason" placeholder="两位标注有分歧时，裁定者填写依据"></textarea></label><div class="grid" id="gallery"></div><p class="muted">本页面支持未完成时导出进度；正式评测会拒绝未完成标注。所有照片仅为课程素材，不能证明品牌、规格或真实售价。</p></main>
<script id="dataset" type="application/json">__DATASET_JSON__</script><script>
const ds=JSON.parse(document.getElementById('dataset').textContent),el=id=>document.getElementById(id);
let state={schema_version:1,data_version:ds.data_version,reviewer:'',queries:ds.queries.map(q=>({query_id:q.id,duplicate_checked:false,exclude_reason:'',decision_reason:'',ratings:Object.fromEntries(ds.gallery.map(g=>[g.sku_code,null]))}))},current=0;
for(const [i,q] of ds.queries.entries()){const option=document.createElement('option');option.value=i;option.textContent=q.id;el('query').append(option)}
function progress(){const complete=state.queries.filter(q=>q.duplicate_checked&&(q.exclude_reason.trim()||Object.values(q.ratings).every(r=>Number.isInteger(r)&&r>=0&&r<=2))).length;el('progress').textContent=`已完成 ${complete} / ${ds.queries.length} 张查询图；分数由人工填写，当前内容不代表算法实验结果。`}
function render(){const q=ds.queries[current],a=state.queries[current];el('query-image').src='../../'+q.path;el('query-title').textContent=q.id;el('query-source').href=q.source_page;el('query-author').textContent=q.author;el('duplicates').checked=a.duplicate_checked;el('exclude').value=a.exclude_reason;el('reason').value=a.decision_reason;const near=ds.near_duplicate_candidates.filter(p=>p.query_id===q.id);el('near').textContent=near.length?'自动近重复候选（需人工复核）：'+near.map(x=>x.sku_code).join('、'):'未发现低距离 dHash 候选，仍需人工核对。';el('gallery').replaceChildren();for(const g of ds.gallery){const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.src='../../'+g.path;img.alt=g.name;const title=document.createElement('p');title.textContent=g.name;const code=document.createElement('p');code.textContent=g.sku_code;code.className='muted';const source=document.createElement('a');source.href=g.source_page;source.target='_blank';source.rel='noopener';source.textContent='照片来源 / '+g.author;const select=document.createElement('select');select.setAttribute('aria-label',g.sku_code+' 相关性');for(const [v,t] of [['','未判断'],['0','0 不相关'],['1','1 弱相关'],['2','2 强相关']]){const o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)}select.value=a.ratings[g.sku_code]===null?'':String(a.ratings[g.sku_code]);select.onchange=()=>{a.ratings[g.sku_code]=select.value===''?null:Number(select.value);progress()};const note=document.createElement('p');note.className='muted';note.textContent=g.source_note?'来源页已按下载图片编号校正，仍需人工复核。':'';card.append(img,title,code,select,source,note);el('gallery').append(card)}progress()}
el('query').onchange=()=>{current=Number(el('query').value);render()};el('reviewer').oninput=()=>{state.reviewer=el('reviewer').value.trim()};el('duplicates').onchange=()=>{state.queries[current].duplicate_checked=el('duplicates').checked;progress()};el('exclude').oninput=()=>{state.queries[current].exclude_reason=el('exclude').value;progress()};el('reason').oninput=()=>{state.queries[current].decision_reason=el('reason').value};el('export').onclick=()=>{if(!state.reviewer){alert('请填写标注人代号');return}const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lamp-relevance-'+state.reviewer.replace(/[^A-Za-z0-9_-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('import').onchange=async()=>{try{const incoming=JSON.parse(await el('import').files[0].text());if(incoming.data_version!==ds.data_version||!Array.isArray(incoming.queries)||incoming.queries.length!==ds.queries.length)throw Error('数据集版本或查询图数量不匹配');for(const q of ds.queries){const a=incoming.queries.find(x=>x.query_id===q.id);if(!a||!a.ratings||ds.gallery.some(g=>!(g.sku_code in a.ratings)))throw Error('缺少查询或商品评分')}state=incoming;el('reviewer').value=state.reviewer;render()}catch(e){alert('导入失败：'+e.message)}};render();
</script></html>
